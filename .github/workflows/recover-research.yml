name: Resume interrupted research
on:
  workflow_run:
    workflows: ['Open research adjudication']
    branches: [main]
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-research.yml'
      - '.github/workflows/research.yml'
permissions: {}
jobs:
  wake:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.event != 'workflow_dispatch' || github.event.workflow_run.display_title != 'Automatic research recovery') &&
        (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out')))
    permissions:
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Wake the protected main-branch worker
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINATING_RUN: ${{ github.event.workflow_run.id }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/research.yml/dispatches" \
            -f ref=main -f "inputs[recover_run]=${ORIGINATING_RUN:-deployment}"
